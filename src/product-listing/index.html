<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Products</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <header class="divider" id="main-header"></header>

    <!-- Feature 6: Breadcrumb -->
    <nav class="breadcrumb" aria-label="breadcrumb"></nav>

    <main class="divider">
        <section class="products">
            <div class="product-list-controls">
                <h2 class="product-list-title">Top Products</h2>
                <!-- Feature 3: Sort -->
                <div class="sort-control">
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select">
                        <option value="">Default</option>
                        <option value="name">Name (A–Z)</option>
                        <option value="price-asc">Price (Low–High)</option>
                        <option value="price-desc">Price (High–Low)</option>
                    </select>
                </div>
            </div>
            <ul class="product-list"></ul>
        </section>
    </main>

    <footer class="divider" id="main-footer"></footer>

    <script type="module" src="/js/product-listing.js"></script>
</body>

</html>
